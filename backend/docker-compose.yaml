version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cicd_monitor_db
    restart: always
    environment:
      POSTGRES_USER: cicd_user
      POSTGRES_PASSWORD: cicd_password
      POSTGRES_DB: cicd_monitor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: